[project]
name = "mathtran"
version = "0.1.2"
description = "Image math formula to LaTeX, with live preview and SVG / PDF / .tex export (CLI, web and desktop app)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# 只放名稱、不放電子郵件：發布到 PyPI 後這裡的資訊會公開顯示
authors = [
    { name = "codemee" }
]
keywords = ["latex", "ocr", "math", "formula", "svg", "pdf", "tectonic", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    # 限定 1.x：2.x 把 pymupdf-layout / pymupdf4llm / onnxruntime / numpy 等一整串東西列為必要相依
    # （其中 pymupdf-layout、pymupdf4llm 沒有宣告授權；onnxruntime 也沒有 macOS Intel 的安裝檔）。
    # 我們只用最基本的功能（開 PDF、轉 SVG、畫圖示），1.x 完全夠用。
    "pymupdf>=1.28,<2",
    "python-multipart>=0.0.34",
    "pywebview>=6.2.1",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/codemee/mathtran"
Source = "https://github.com/codemee/mathtran"
Changelog = "https://github.com/codemee/mathtran/blob/main/CHANGELOG.md"
Issues = "https://github.com/codemee/mathtran/issues"

[project.scripts]
mathtran = "mathtran.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
