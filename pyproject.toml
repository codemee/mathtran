[project]
name = "mathtran"
version = "0.1.0"
description = "Image math formula to LaTeX, with SVG/PDF export (CLI, web, desktop)"
readme = "README.md"
authors = [
    { name = "meebox", email = "meebox@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "pymupdf>=2.2",
    "python-multipart>=0.0.34",
    "pywebview>=6.2.1",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mathtran = "mathtran.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
