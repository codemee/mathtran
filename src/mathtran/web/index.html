<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathTran</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/vendor/katex.min.css">
<style>
  /* ===== 配色 =====
     淺色：鋼彈 RX-78-2 —— 白色機身、胸口與手臂的藍、紅色點綴、黃色 V 字天線
     深色：新世紀福音戰士 —— 初號機的紫、螢光綠，加上 NERV 的橘與紅
     （只借用配色，沒有使用任何標誌或圖案。）
     --accent        文字 / 外框 / 連結用的強調色（要在卡片底色上看得清楚）
     --accent-solid  實心按鈕與勾選框的底色（配 --on-accent 的字）
     「跟隨系統」時由 prefers-color-scheme 決定；手動選擇時用 <html data-theme="light|dark"> 覆寫。 */
  :root { color-scheme: light dark;
          --bg:#eef1f6; --card:#ffffff; --fg:#16233a; --muted:#5d6b82; --line:#d5dce8;
          --accent:#1d4fa8; --accent-solid:#1d4fa8; --on-accent:#ffffff;
          --err:#c8202b; --err-solid:#d7262c; --ok:#216a3f; --cache:#0b6479; --edit:#8a5600; --sel:#e3ebf8;
          /* LaTeX 語法標色（對 --bg 的對比都 ≥ 4.5:1） */
          --tk-cmd:#1558d6; --tk-text:#0b6b3a; --tk-op:#b3261e; --tk-num:#8a4b00; --tk-brace:#7b3fa6; --tk-cmt:#5d6b82; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
          --bg:#0c0916; --card:#161026; --fg:#ebe6f7; --muted:#9b90b8; --line:#2c2245;
          --accent:#b794ff; --accent-solid:#7a47e0; --on-accent:#ffffff;
          --err:#ff6b78; --err-solid:#d92d3d; --ok:#5bff7e; --cache:#4fe0c0; --edit:#ffa63d; --sel:#251a42;
          --tk-cmd:#6fa8ff; --tk-text:#6ee7a0; --tk-op:#ff8a80; --tk-num:#ffc27a; --tk-brace:#e0a8ff; --tk-cmt:#9b90b8; }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark;
          --bg:#0c0916; --card:#161026; --fg:#ebe6f7; --muted:#9b90b8; --line:#2c2245;
          --accent:#b794ff; --accent-solid:#7a47e0; --on-accent:#ffffff;
          --err:#ff6b78; --err-solid:#d92d3d; --ok:#5bff7e; --cache:#4fe0c0; --edit:#ffa63d; --sel:#251a42;
          --tk-cmd:#6fa8ff; --tk-text:#6ee7a0; --tk-op:#ff8a80; --tk-num:#ffc27a; --tk-brace:#e0a8ff; --tk-cmt:#9b90b8; }

  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif; padding-bottom:44px }
  /* 工具列：靠右的三個圖示按鈕（語言、配色、API key） */
  #toolbar { display:flex; justify-content:flex-end; align-items:center; gap:2px; padding:4px 20px 0 }
  .tb { position:relative; width:30px; height:30px; padding:0; border-radius:9px; background:transparent; color:var(--fg);
        display:inline-grid; place-items:center; border:0 }
  .tb:hover { background:color-mix(in srgb, var(--accent) 14%, transparent) }
  .tb svg { width:18px; height:18px; display:block }
  .tb .tbtxt { font-size:14px; font-weight:800; letter-spacing:-.3px }
  .tb .dot { position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--err-solid); border:1.5px solid var(--bg) }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; padding:6px 20px 16px }
  @media (max-width:800px) { main { grid-template-columns:1fr } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0 }
  h2 { font-size:15px; margin:0; color:var(--fg); font-weight:700; display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  /* 步驟編號：漸層圓形徽章 */
  .step { flex:none; width:28px; height:28px; border-radius:50%; display:inline-grid; place-items:center; color:#fff;
          font-size:14px; font-weight:800; line-height:1; background:var(--accent-solid) }
  h2 .hint { font-weight:400 }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .row.between { justify-content:space-between }
  button.small { padding:4px 11px; font-size:13px }
  .lbl { color:var(--muted); font-size:13px }
  .hint { color:var(--muted); font-size:12px }
  button { background:var(--accent-solid); color:var(--on-accent); border:0; border-radius:8px; padding:7px 13px; font:inherit; cursor:pointer }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent) }
  button.link { background:none; color:var(--accent); padding:2px 4px; font-size:13px }
  button.danger { background:var(--err-solid); color:#fff }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  #cacheInfo code { font-size:12px; word-break:break-all; color:var(--muted) }
  button:disabled { opacity:.45; cursor:not-allowed }
  button[hidden] { display:none }
  label.chk { display:inline-flex; gap:5px; align-items:center; font-size:13px; cursor:pointer }
  input[type=checkbox] { accent-color:var(--accent-solid) }
  /* 圖片清單 */
  #list { border:2px dashed var(--line); border-radius:8px; min-height:240px; max-height:calc(100vh - 372px); overflow:auto; outline:none; padding:6px }
  .zoom { display:inline-flex; gap:6px; align-items:center; margin-left:auto; font-size:12px; color:var(--muted) }
  .zoom input { width:90px }
  #list:focus-visible { border-color:var(--accent) }
  body.dragging #list { border-color:var(--accent); background:var(--sel) }
  #empty { color:var(--muted); text-align:center; padding:60px 12px; font-size:14px }
  /* 看圖程式風格：縮圖格狀排列，圖片完整顯示；勾選框、狀態標籤疊在圖片上，檔名是圖片下方的簡潔說明列 */
  #list.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(var(--thumb,170px), 1fr)); gap:10px; align-content:start }
  /* 高度直接指定：aspect-ratio 在 grid 裡不會被列高計算採用，會造成卡片互相重疊（圖片區 4:3 + 28px 說明列） */
  .item { position:relative; height:calc(var(--thumb, 170px) * .75 + 28px); display:flex; flex-direction:column; cursor:pointer;
          border-radius:10px; overflow:hidden; background:var(--card); border:1px solid var(--line); transition:border-color .12s, box-shadow .12s }
  .item:hover { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)) }
  .item.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) }
  .item .imgbox { flex:1; min-height:0; background:#fff; position:relative }
  .item img.thumb { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:6px }
  .item .nm { flex:none; height:28px; line-height:27px; padding:0 10px; font-size:12px; color:var(--muted);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-top:1px solid var(--line); background:var(--card) }
  .item.sel .nm { color:var(--fg) }
  /* 扁平風格的勾選框 */
  .item .rowchk { appearance:none; -webkit-appearance:none; position:absolute; top:8px; left:8px; width:20px; height:20px; margin:0; cursor:pointer;
                  border-radius:6px; border:1.5px solid #aab3c5; background:rgba(255,255,255,.94); display:grid; place-content:center }
  .item .rowchk:hover { border-color:var(--accent-solid) }
  .item .rowchk:checked { background:var(--accent-solid); border-color:var(--accent-solid) }
  .item .rowchk:checked::after { content:""; width:10px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff;
                                 transform:rotate(-45deg) translate(1px,-1px) }
  .item .badge { position:absolute; top:8px; right:8px }
  /* 扁平風格的狀態標籤：淡色底、無外框 */
  .badge { font-size:11px; font-weight:600; border-radius:999px; padding:1px 9px; white-space:nowrap;
           background:color-mix(in srgb, currentColor 14%, var(--card)) }
  .b-idle { color:var(--muted) } .b-run { color:var(--accent) } .b-ok { color:var(--ok) }
  .b-cache { color:var(--cache) } .b-edit { color:var(--edit) } .b-err { color:var(--err) }
  /* 右側 */
  #orig { min-height:60px; max-height:150px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden }
  #orig img { max-width:100%; max-height:148px; object-fit:contain }
  #orig:empty::before { content:attr(data-empty); color:#8c94a8; font-size:13px }
  textarea { width:100%; min-height:100px; font:14px/1.4 ui-monospace,Consolas,monospace; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; resize:vertical }
  /* LaTeX 編輯區：透明的 textarea 疊在標色層（#hl）上；兩者的字型、邊框、內距、換行、捲軸槽完全一致，字才會對齊 */
  /* 編輯區的外框（#edBox）：右上角的「LaTeX 文字 / 圖形編輯」切換鈕在框內，和預覽區的按鈕一樣；裡面的編輯器自己不畫框線 */
  #edBox { border:1px solid var(--line); border-radius:8px; background:var(--bg) }
  #edBox:focus-within { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) }
  .ed { position:relative; border-radius:0 0 8px 8px }
  .ed > * { margin:0; box-sizing:border-box; font:14px/1.4 ui-monospace,Consolas,monospace;
            letter-spacing:0; tab-size:4; border:1px solid transparent; border-radius:8px; padding:8px;
            white-space:pre-wrap; overflow-wrap:break-word; word-break:normal; scrollbar-gutter:stable }
  .ed textarea { display:block; width:100%; height:104px; min-height:100px; background:transparent; color:transparent; caret-color:var(--fg); border-color:transparent; overflow-y:auto; outline:none }
  /* 圖形化編輯（MathLive，第一次按「圖形編輯」才載入） */
  #gfxBox math-field { display:block; width:100%; box-sizing:border-box; min-height:100px; padding:8px 10px; font-size:24px; background:transparent; color:var(--fg);
            border:0; border-radius:0 0 8px 8px; outline:none; --caret-color:var(--fg); --selection-background-color:color-mix(in srgb, var(--accent) 30%, transparent);
            --selection-color:var(--fg); --primary:var(--accent-solid); --text-font-family:system-ui,"Microsoft JhengHei",sans-serif }
  #gfxBox[hidden], .ed[hidden] { display:none }
  .ed-tools { display:flex; justify-content:flex-end; gap:2px; padding:5px 8px 0 }
  #hl { position:absolute; inset:0 }   /* 大小跟著 textarea（使用者拖曳調整高度時一起變） */
  .ed textarea::selection { background:color-mix(in srgb, var(--accent) 30%, transparent); color:transparent }
  .ed textarea:disabled { opacity:1 }
  #hl { color:var(--fg); overflow:hidden; pointer-events:none }
  #hl .c { color:var(--tk-cmd) } #hl .t { color:var(--tk-text) } #hl .o { color:var(--tk-op) } #hl .n { color:var(--tk-num) }
  #hl .b { color:var(--tk-brace) } #hl .k { color:var(--tk-cmt); font-style:italic }
  #hl .m { background:color-mix(in srgb, var(--accent) 28%, transparent); border-radius:2px; font-weight:700 }
  #hl .u { text-decoration:underline wavy var(--err); text-underline-offset:3px }
  /* 預覽區：公式會自動縮小到完整可見（見 fitPreview）；用一般區塊 + text-align 置中，
     不用 flex 置中——flex 置中在內容太寬時左側會被切掉而且捲不到 */
  #pvBox { position:relative; border:1px solid var(--line); border-radius:10px; background:var(--card) }
  #preview { min-height:140px; padding:36px 14px 14px; overflow-x:auto; text-align:center; font-size:1.3em }
  #preview .katex-display { margin:0 }
  #preview img { display:block; margin:0 auto; width:100%; max-height:220px; object-fit:contain }
  /* 精準預覽是一張 SVG（黑字、透明底）：深色配色下墊一層白底，才看得清楚 */
  :root[data-theme="dark"] #preview img { background:#fff; border-radius:6px }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #preview img { background:#fff; border-radius:6px } }
  /* 壓在預覽畫面上的透明背景按鈕 */
  .pv-tools { position:absolute; top:6px; right:8px; display:flex; align-items:center; gap:2px; z-index:2 }
  .ghost { background:transparent; color:var(--muted); border:0; border-radius:7px; padding:3px 10px; font-size:12px; font-weight:600 }
  .ghost:hover:not(:disabled) { background:rgba(127,127,127,.16); color:var(--fg) }
  .ghost.on { color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent) }
  .ghost:disabled { opacity:.35 }
  .pv-sep { width:1px; height:14px; background:var(--line); margin:0 4px }
  .fmts { display:inline-flex; gap:12px; flex-wrap:wrap }
  /* 狀態列 */
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:16px; align-items:flex-start; justify-content:space-between;
         padding:8px 20px; background:var(--card); border-top:1px solid var(--line); font-size:13px; color:var(--muted); z-index:10 }
  #msg { flex:1; min-width:0; max-height:6.5em; overflow:auto; white-space:pre-wrap; word-break:break-all }
  #msg.err { color:var(--err) } #msg.ok { color:var(--fg) }
  #health { white-space:nowrap; flex:none } #health .bad { color:var(--err) }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg) }
  dialog::backdrop { background:rgba(10,12,24,.45) }
  dialog input { width:340px; padding:8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px }
</style>
</head>
<body>
<nav id="toolbar" role="toolbar">
  <button class="tb" id="langBtn"></button>
  <button class="tb" id="themeBtn"></button>
  <button class="tb" id="keyBtn"></button>
</nav>
<main>
  <section id="left">
    <h2><span class="step">1</span><span data-i18n="step1">圖片清單</span> <span id="count" class="hint"></span></h2>
    <div class="row">
      <button class="secondary" id="addFiles" data-i18n="add_files">＋ 加入檔案</button>
      <button class="secondary" id="addFolder" data-i18n="add_folder">＋ 加入資料夾</button>
      <span class="hint" data-i18n="add_hint">也可貼上 (Ctrl+V) 或把檔案 / 資料夾拖進視窗</span>
    </div>
    <input type="file" id="fileIn" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    <input type="file" id="folderIn" webkitdirectory hidden>
    <div class="row">
      <label class="chk"><input type="checkbox" id="checkAll"> <span data-i18n="check_all">全選</span></label>
      <button class="link" id="rmChecked" data-i18n="remove_checked">移除勾選</button>
      <button class="link" id="clearAll" data-i18n="clear_all">清空</button>
      <label class="zoom"><span data-i18n="thumb">縮圖</span> <input type="range" id="thumbSize" min="100" max="320" step="10" value="170"></label>
    </div>
    <div id="list" tabindex="0"></div>
    <div class="row between">
      <span class="row">
        <span class="lbl" data-i18n="ocr_label">辨識：</span>
        <button class="act" id="ocrSel"></button>
        <button class="act" id="ocrChk"></button>
        <button class="act" id="ocrAll"></button>
        <button class="secondary" id="stopBtn" hidden data-i18n="stop">停止</button>
      </span>
      <span class="row">
        <button class="secondary small" id="cacheBtn" data-i18n="cache_btn" data-i18n-title="cache_btn_title">快取…</button>
      </span>
    </div>
    <label class="chk"><input type="checkbox" id="force"> <span data-i18n="force">忽略快取，強制重新辨識（會覆蓋手動修改）</span></label>
  </section>
  <section id="right">
    <h2><span class="step">2</span><span data-i18n="step2">辨識結果</span> <span id="curName" class="hint"></span><span id="curBadge"></span></h2>
    <div id="orig"></div>
    <div id="edBox">
    <div class="ed-tools" role="group">
      <button class="ghost on" id="txtBtn" data-i18n="ed_text" data-i18n-title="ed_text_title">LaTeX 文字</button>
      <button class="ghost" id="gfxBtn" data-i18n="gfx" data-i18n-title="gfx_title">圖形編輯</button>
    </div>
    <div id="gfxBox" hidden></div>
    <div class="ed"><pre id="hl" aria-hidden="true"></pre><textarea id="latex" spellcheck="false" disabled></textarea></div>
    </div>
    <h2><span class="step">3</span><span data-i18n="step3">預覽</span></h2>
    <div id="pvBox">
      <div class="pv-tools">
        <button class="ghost on" id="pvLive" data-i18n="pv_live" data-i18n-title="pv_live_title">即時</button>
        <button class="ghost" id="pvAcc" data-i18n="pv_acc" data-i18n-title="pv_acc_title">精準</button>
        <span class="pv-sep"></span>
        <button class="ghost" id="pvCopy" data-i18n="pv_copy" data-i18n-title="pv_copy_title">複製 LaTeX</button>
      </div>
      <div id="preview"></div>
    </div>
    <div class="row">
      <span class="lbl" data-i18n="fmt_label">匯出格式：</span>
      <span class="fmts">
        <label class="chk"><input type="checkbox" class="fmt" value="svg" checked> SVG</label>
        <label class="chk"><input type="checkbox" class="fmt" value="pdf"> PDF</label>
        <label class="chk"><input type="checkbox" class="fmt" value="tex"> LaTeX (.tex)</label>
      </span>
    </div>
    <div class="row">
      <span class="lbl" data-i18n="exp_label">匯出：</span>
      <button class="act" id="expSel"></button>
      <button class="act" id="expChk"></button>
      <button class="act" id="expAll"></button>
    </div>
    <div class="hint" data-i18n="exp_hint"></div>
  </section>
</main>
<footer id="bar"><span id="msg"></span><span id="health"></span></footer>
<dialog id="cacheDlg">
  <h3 style="margin:0 0 8px" data-i18n="cd_title">辨識快取</h3>
  <div id="cacheInfo" style="font-size:14px"></div>
  <p class="hint" style="max-width:440px;margin:10px 0" data-i18n-html="cd_desc"></p>
  <div class="row">
    <button class="danger" id="cacheClearList"></button>
    <button class="danger" id="cacheClearAll" data-i18n="cd_clear_all">清除全部快取</button>
    <button class="secondary" id="cacheClose" autofocus data-i18n="cd_close">關閉</button>
  </div>
</dialog>
<dialog id="keyDlg">
  <form method="dialog">
    <p data-i18n="kd_text"></p>
    <input id="keyIn" type="password" placeholder="sk-ant-...">
    <div class="row" style="margin-top:10px"><button id="keySave" value="ok" data-i18n="kd_save">儲存</button><button class="secondary" value="cancel" data-i18n="kd_cancel">取消</button></div>
  </form>
</dialog>
<script src="/vendor/katex.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ALLOWED_TYPE = /^image\/(png|jpeg|webp|gif)$/;
const ALLOWED_EXT = /\.(png|jpe?g|webp|gif)$/i;
const CONCURRENCY = 3;

// ====================== 多語系（繁體中文 / English） ======================
// 一律用 t(key, vars)。vars.n === 1 且有 key_one 時，用單數說法（英文需要）。
const I18N = {
  "zh-TW": {
    step1: "圖片清單", step2: "辨識結果", step3: "預覽",
    count: "（共 {n} 張，已勾選 {m} 張）",
    add_files: "＋ 加入檔案", add_folder: "＋ 加入資料夾",
    add_hint: "也可貼上 (Ctrl+V) 或把檔案 / 資料夾拖進視窗",
    check_all: "全選", remove_checked: "移除勾選", clear_all: "清空", thumb: "縮圖",
    list_aria: "圖片清單", ocr_label: "辨識：", exp_label: "匯出：", fmt_label: "匯出格式：",
    b_sel: "目前檢視", b_chk: "勾選的 ({n})", b_all: "全部 ({n})", stop: "停止",
    cache_btn: "快取…", cache_btn_title: "查看或清除辨識快取",
    force: "忽略快取，強制重新辨識（會覆蓋手動修改）",
    orig_empty: "尚未選取圖片",
    latex_ph_none: "請先在左側選取一張圖片",

function resolveLang(pref) {   // 「跟隨系統」：中文系統 → 繁體中文，其他 → English
  if (pref === "zh-TW" || pref === "en") return pref;
  return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh-TW" : "en";
}
function t(key, vars) {

const apiFetch = (url, opts = {}) => fetch(url, { ...opts, headers: { ...(opts.headers || {}), "X-Lang": LANG } });

            settings: { ...DEFAULTS, formats: [...DEFAULTS.formats] }, msgRef: null };
const hasResult = it => it.latex != null && it.latex.trim() !== "";

// setStatus：原樣顯示（伺服器回來的錯誤、拼接好的訊息）；status：用語言表，切換語言時會重新翻譯
function showStatus(text, kind, ref) { $("msg").textContent = text; $("msg").className = kind || ""; S.msgRef = ref || null; }
const setStatus = (text, kind) => showStatus(text, kind);
const status = (key, vars, kind) => showStatus(t(key, vars), kind, { key, vars, kind });
function setErr(m) {  // 空字串只會清掉「錯誤」，不影響其他訊息（如已儲存路徑）

// 存在伺服器端的設定檔，不用 localStorage：桌面版每次啟動的埠號都不同，localStorage 會遺失。
// 還沒送出的變更先累積起來：縮圖滑桿拖動時會防抖，若這時又改了別的設定，不能把先前那筆吃掉。
let saveTimer, pendingPatch = {};
function flushSettings() {
  clearTimeout(saveTimer);
  const patch = pendingPatch; pendingPatch = {};
  if (Object.keys(patch).length) {

                                body: JSON.stringify(patch) }).catch(() => {});

}

// ====================== LaTeX 語法標色 ======================
// 透明的 textarea 疊在 #hl 上，#hl 畫出同樣的文字加上顏色；游標在 { } 旁邊時，把成對的括號一起標出來，沒有配對的括號畫紅色波浪底線。
const HL_TEXT_CMDS = new Set(["text", "mbox", "textbf", "textit", "textrm", "textsf", "texttt"]);   // 這些指令的 {…} 裡是文字，不是數學

function hlTokens(s) {

    else if (ch === "\\") {

      const r = m.exec(s);
      if (!r) { push("c", s.slice(i, i + 2)); i += 2; continue; }   // \\  \,  \{  \% 之類：單一符號的指令
      push("c", r[0]); i += r[0].length;

        const q = sp.exec(s);
        if (q) {
          if (q[0].length > 1) push("", q[0].slice(0, -1));
          i += q[0].length; open();
          let depth = 1, e = i;
          while (e < s.length) {   // 找對應的 }；裡面的括號與跳脫字元都算在文字裡
            if (s[e] === "\\") { e += 2; continue; }

            e++;

      let e = i + 1;   // 一般文字：一路到下一個特殊字元

  }
  let html = "";

async function sha256(blob) {
  const d = await crypto.subtle.digest("SHA-256", await blob.arrayBuffer());
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}
const byName = (a, b) => a.name.localeCompare(b.name, "zh-Hant", { numeric: true });

async function addFiles(entries, { sort = true } = {}) {
  const imgs = entries.filter(e => ALLOWED_TYPE.test(e.file.type) || ALLOWED_EXT.test(e.name));
  if (!imgs.length) { if (entries.length) errKey("m_no_images"); return; }
  status("m_reading", { n: imgs.length });
  const known = new Set(S.items.map(i => i.hash)); let dup = 0; const fresh = [];
  for (const e of imgs) {
    const hash = await sha256(e.file);
    if (known.has(hash)) { dup++; continue; }
    known.add(hash);
    fresh.push({ id: S.nextId++, name: e.name, file: e.file, url: URL.createObjectURL(e.file), hash,
                 latex: null, base: null, edited: false, fromCache: false, state: "idle", error: null, checked: false });
  }
  if (sort) fresh.sort(byName);
  let hits = {};
  try {   // 查快取，已辨識過的直接帶出結果
    for (let i = 0; i < fresh.length; i += 500) {
      const r = await apiFetch("/api/cache/lookup", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hashes: fresh.slice(i, i + 500).map(f => f.hash) }) });
      Object.assign(hits, await r.json());
    }
  } catch (e) { /* 快取查詢失敗不影響加入 */ }
  let cached = 0;
  for (const it of fresh) {
    const h = hits[it.hash];
    if (h) { it.latex = h.latex; it.edited = h.edited; it.fromCache = true; if (!h.edited) it.base = h.latex; cached++; }
  }
  S.items.push(...fresh);
  if (fresh.length && !cur()) S.sel = fresh[0].id;
  renderList(); syncRight();
  const parts = [t("m_added", { n: fresh.length })];
  if (cached) parts.push(t("m_added_cached", { n: cached }));
  if (dup) parts.push(t("m_added_dup", { n: dup }));
  setStatus(parts.join(t("sep")), fresh.length ? "ok" : "");
}

async function entriesFromDrop(dt) {
  const out = [];
  // webkitGetAsEntry 必須在 drop 事件同步階段呼叫，所以先取出 entry 再 await
  const ents = [...dt.items].filter(i => i.kind === "file").map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const walk = async (entry, path) => {
    if (entry.isFile) {
      out.push({ file: await new Promise((res, rej) => entry.file(res, rej)), name: path + entry.name });
    } else if (entry.isDirectory) {
      const reader = entry.createReader(); let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const c of batch) await walk(c, path + entry.name + "/");
      } while (batch.length);
    }
  };
  if (ents.length) for (const e of ents) await walk(e, "");
  else for (const f of dt.files) out.push({ file: f, name: f.name });
  return out;
}

  const ids = new Set(list.map(i => i.id));
  list.forEach(i => { URL.revokeObjectURL(i.url); if (i.acc) URL.revokeObjectURL(i.acc.url); });
  const idx = S.items.findIndex(i => i.id === S.sel);
  S.items = S.items.filter(i => !ids.has(i.id));
  if (ids.has(S.sel)) S.sel = (S.items[Math.min(idx, S.items.length - 1)] || {}).id ?? null;
  renderList(); syncRight();
  status("m_removed", { n: list.length }, "ok");
}
$("rmChecked").onclick = () => removeItems(checked());
$("clearAll").onclick = () => removeItems([...S.items]);

// ====================== 辨識 ======================
async function check(r) {
  if (r.ok) return r;
  let msg = r.statusText;
  try { msg = (await r.json()).detail || msg; } catch {}
  throw new Error(msg);
}
async function runOcr(list, scopeKey) {
  const scope = t(scopeKey);
  if (!list.length) { errKey("m_ocr_empty", { scope }); return; }
  flushPersist();
  const force = $("force").checked;
  const todo = force ? list : list.filter(it => !hasResult(it));
  const skipped = list.length - todo.length;
  if (!todo.length) { status("m_ocr_all_done", { scope, n: list.length }, "ok"); return; }
  const editedN = force ? todo.filter(it => it.edited).length : 0;
  if (editedN && !confirm(t("m_confirm_force", { n: editedN }))) return;

  setBusy(true, true);
  todo.forEach(it => { it.state = "queued"; it.error = null; });
  renderList();
  const queue = [...todo];
  let done = 0, fresh = 0, fromCache = 0, fail = 0, fatal = null;
  const worker = async () => {
    while (queue.length && !S.cancel && !fatal) {
      const it = queue.shift();
      it.state = "running"; renderList();
      try {
        const fd = new FormData(); fd.append("file", it.file, "image");
        const r = await check(await apiFetch("/api/ocr" + (force ? "?force=true" : ""), { method: "POST", body: fd }));
        const j = await r.json();
        it.latex = j.latex; it.base = j.latex; it.edited = false; it.fromCache = j.cached; it.state = "idle";
        j.cached ? fromCache++ : fresh++;
      } catch (e) {
        it.state = "error"; it.error = e.message; fail++;
        if (/API key/.test(e.message)) fatal = e.message;   // 沒設定 key：不必每張都試（兩種語言的訊息都含 "API key"）
      }
      done++;
      status("m_progress", { done, total: todo.length });
      renderList();
      if (cur() === it) syncRight();
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, todo.length) }, worker));
  queue.forEach(it => { it.state = "idle"; });   // 被停止 / 中止而沒處理到的
  const stopped = S.cancel;
  setBusy(false); renderList(); syncRight();
  if (fatal) { setErr(fatal); return; }
  const parts = [t("p_new", { n: fresh }), t("p_cache", { n: fromCache })];
  if (fail) parts.push(t("p_fail", { n: fail }));
  if (skipped) parts.push(t("p_skip", { n: skipped }));
  setStatus((stopped ? t("m_stopped", { done, total: todo.length }) : t("m_done")) + parts.join(t("sep2")), fail ? "err" : "ok");
}
$("stopBtn").onclick = () => { S.cancel = true; status("m_stopping"); };
$("ocrSel").onclick = () => runOcr(cur() ? [cur()] : [], "scope_sel");
$("ocrChk").onclick = () => runOcr(checked(), "scope_chk");
$("ocrAll").onclick = () => runOcr([...S.items], "scope_all");

// ====================== 預覽 / 複製 ======================
async function exportOne(fmt, latex) {
  const r = await check(await apiFetch("/api/export/" + fmt, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ latex }) }));
  return r.blob();
}
// 預覽區右上角：即時 / 精準 切換（可來回切換），以及複製
$("pvLive").onclick = () => { S.pv = "live"; renderPreview(); };
$("pvAcc").onclick = async () => {
  const it = cur(); if (!it || !hasResult(it)) return;
  if (it.acc && it.acc.latex === it.latex) { S.pv = "acc"; renderPreview(); return; }   // 已編譯過，直接切換
  const snapshot = it.latex;
  $("pvAcc").disabled = true; status("m_compiling");
  try {
    const url = URL.createObjectURL(await exportOne("svg", snapshot));
    if (it.acc) URL.revokeObjectURL(it.acc.url);
    it.acc = { latex: snapshot, url };
    if (cur() === it && it.latex === snapshot) { S.pv = "acc"; renderPreview(); }   // 編譯途中換圖 / 改內容就不強制切換
    status("m_acc_done", null, "ok");
  } catch (e) { setErr(e.message); } finally { updateCounts(); }
};
$("pvCopy").onclick = async () => {
  const it = cur(); if (!it || !hasResult(it)) return;
  try { await navigator.clipboard.writeText(it.latex); status("m_copied", null, "ok"); }
  catch (e) { errKey("m_copy_fail", { err: e.message }); }
};

// ====================== 匯出 ======================
const isDesktop = () => !!(window.pywebview && window.pywebview.api && window.pywebview.api.save_file);
const toB64 = blob => new Promise((res, rej) => {
  const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob);
});
function stemOf(name) {
  const base = name.split(/[\\/]/).pop().replace(/\.(png|jpe?g|webp|gif|bmp)$/i, "").replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").trim();
  return base || "formula";
}
async function saveSingle(blob, name) {
  // 桌面視窗：pywebview 會擋下載，改走另存新檔對話框
  if (isDesktop()) {
    const path = await window.pywebview.api.save_file(name, await toB64(blob));
    if (path) status("m_saved", { path }, "ok"); else status("m_save_cancel");
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  status("m_downloaded", { name }, "ok");
}
// 匯出格式：核取方塊，可複選（至少要留一個）；選擇存在伺服器端的設定檔
const FMT_LABEL = { svg: "SVG", pdf: "PDF", tex: ".tex" };
const fmtBoxes = [...document.querySelectorAll(".fmt")];
const selectedFormats = () => fmtBoxes.filter(b => b.checked).map(b => b.value);
fmtBoxes.forEach(b => b.addEventListener("change", () => {
  if (!selectedFormats().length) { b.checked = true; status("m_fmt_min"); return; }
  saveSettings({ formats: selectedFormats() });
}));

async function runExport(list, scopeKey) {
  const scope = t(scopeKey);
  if (!list.length) { errKey("m_exp_empty", { scope }); return; }
  flushPersist();
  const fmts = selectedFormats(), fmtText = fmts.map(f => FMT_LABEL[f]).join(t("sep2"));
  const ready = list.filter(hasResult), skipped = list.length - ready.length;
  if (!ready.length) { errKey("m_exp_none", { scope }); return; }
  setBusy(true); status("m_exporting", { fmts: fmtText, n: ready.length });
  try {
    const skipNote = skipped ? t("n_skip_unrec", { n: skipped }) : "";
    if (ready.length === 1 && fmts.length === 1) {   // 只有 1 個檔案：直接另存新檔 / 下載
      await saveSingle(await exportOne(fmts[0], ready[0].latex), stemOf(ready[0].name) + "." + fmts[0]);
      if (skipped) setStatus($("msg").textContent + skipNote, $("msg").className);
      return;
    }
    const r = await check(await apiFetch("/api/export/batch", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ formats: fmts, items: ready.map(it => ({ name: it.name, latex: it.latex })) }) }));
    const ok = +r.headers.get("X-Ok-Count"), fail = +r.headers.get("X-Fail-Count");
    const blob = await r.blob();
    const failNote = fail ? t("n_fail_see", { n: fail }) : "";
    if (isDesktop() && window.pywebview.api.save_zip_to_folder) {
      const res = await window.pywebview.api.save_zip_to_folder(await toB64(blob));
      if (!res) { status("m_exp_cancel"); return; }
      setStatus(t("m_exp_folder", { n: ok, fmts: fmtText, dir: res.dir, fail: failNote, skip: skipNote }), fail ? "err" : "ok");
    } else {
      const name = `mathtran-export-${fmts.join("-")}.zip`;
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setStatus(t("m_exp_zip", { name, n: ok, fmts: fmtText, fail: failNote, skip: skipNote }), fail ? "err" : "ok");
    }
  } catch (e) { setErr(e.message); }
  finally { setBusy(false); }
}
$("expSel").onclick = () => runExport(cur() ? [cur()] : [], "scope_sel");
$("expChk").onclick = () => runExport(checked(), "scope_chk");
$("expAll").onclick = () => runExport([...S.items], "scope_all");

// ====================== 快取管理 ======================
async function refreshCacheInfo() {
  const s = await (await apiFetch("/api/cache")).json();
  const kb = (s.bytes / 1024).toFixed(1);
  $("cacheInfo").replaceChildren();
  const line = document.createElement("div");
  line.textContent = t("cd_count", { n: s.count }) + (s.count ? t("cd_detail", { e: s.edited, kb }) : "");
  const path = document.createElement("code"); path.textContent = s.path;
  $("cacheInfo").append(line, path);
  $("cacheClearAll").disabled = S.busy || s.count === 0;
  $("cacheClearList").textContent = t("cd_clear_list", { n: S.items.length });
  $("cacheClearList").disabled = S.busy || S.items.length === 0;
  return s;
}
$("cacheBtn").onclick = async () => {
  try { await refreshCacheInfo(); $("cacheDlg").showModal(); } catch (e) { errKey("m_cache_info_fail", { err: e.message }); }
};
$("cacheClose").onclick = () => $("cacheDlg").close();
// 清除後，清單內項目的結果也一併清掉（否則畫面上還顯示「已快取」卻其實沒有快取，會讓人困惑）
function resetResults(list) {
  for (const it of list) {
    clearTimeout(persistTimers.get(it.id)); persistTimers.delete(it.id);   // 避免待存的修改又把快取寫回去
    if (it.acc) URL.revokeObjectURL(it.acc.url);
    Object.assign(it, { latex: null, base: null, edited: false, fromCache: false, acc: null, state: "idle", error: null });
  }
  S.pv = "live";
  renderList(); syncRight();
}
async function clearCache(scope) {
  if (S.busy) { errKey("m_busy_no_clear"); return; }
  flushPersist();
  const list = [...S.items];
  const editedInList = list.filter(i => i.edited).length;
  const s = await (await apiFetch("/api/cache")).json();
  const msg = scope === "all"
    ? t("c_clear_all", { n: s.count }) + (s.edited ? t("c_edited_all", { e: s.edited }) : "")
    : t("c_clear_list", { n: list.length }) + (editedInList ? t("c_edited_list", { e: editedInList }) : "");
  if ((scope === "all" || editedInList) && !confirm(msg)) return;
  try {
    const r = scope === "all"
      ? await check(await apiFetch("/api/cache", { method: "DELETE" }))
      : await check(await apiFetch("/api/cache/remove", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hashes: list.map(i => i.hash) }) }));
    const { removed } = await r.json();
    resetResults(list);
    $("cacheDlg").close();
    setStatus(t("m_cache_cleared", { n: removed }) + (list.length ? t("m_cache_cleared_list", { n: list.length }) : ""), "ok");
  } catch (e) { setErr(e.message); }
}
$("cacheClearAll").onclick = () => clearCache("all");
$("cacheClearList").onclick = () => clearCache("list");

// ====================== API key / 健康狀態 ======================
$("keyBtn").onclick = () => $("keyDlg").showModal();
$("keySave").onclick = async () => {
  const k = $("keyIn").value.trim();
  if (k) await apiFetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ api_key: k }) });
  $("keyIn").value = ""; health();
  if (k) status("m_key_saved", null, "ok");
};
async function health() {
  try {
    const h = await (await apiFetch("/api/health")).json();
    const item = (ok, good, bad) => ok ? t(good) : `<span class="bad">${t(bad)}</span>`;
    $("health").innerHTML = item(h.api_key, "h_key_ok", "h_key_bad") + "　" + item(h.tectonic, "h_tec_ok", "h_tec_bad");
    const dot = $("keyBtn").querySelector(".dot"); if (dot) dot.hidden = !!h.api_key;   // 還沒設定 API key：圖示右上角顯示紅點
  } catch (e) { /* 伺服器暫時沒回應就維持原狀 */ }
}

// ====================== 啟動 ======================
(async function init() {
  try {
    const r = await fetch("/api/settings");
    if (r.ok) Object.assign(S.settings, await r.json());
  } catch (e) { /* 讀不到就用預設值 */ }
  LANG = resolveLang(S.settings.lang);
  applyTheme();
  $("thumbSize").value = S.settings.thumb; applyThumb(S.settings.thumb);
  fmtBoxes.forEach(b => { b.checked = S.settings.formats.includes(b.value); });
  applyStatic(); renderToolbar(); renderList(); syncRight();
  status("ready");
  health();
})();
</script>
